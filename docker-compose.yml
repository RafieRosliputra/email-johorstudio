# Johor Studio mail — send-only SMTP (noreply@) that relays outbound through a
# smarthost, plus Roundcube webmail. Deployed as a TrueNAS Custom App.
#
# - docker-mailserver: Postfix (submission 587) + Dovecot (IMAP) for the single
#   mailbox noreply@johorstudio.com. Outbound is relayed via RELAY_* (smarthost).
#   No inbound port 25 (send-only). Apps on the LAN submit via host port 1587.
# - roundcube: webmail at mail.johorstudio.com (via the existing Cloudflare tunnel).
#
# Build/pull images on the host, then install as a Custom App (see deploy/DEPLOY.md).
services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:14.0.0
    container_name: dms
    hostname: mail.johorstudio.com
    env_file: ./mailserver.env
    ports:
      - "1587:587"          # submission for LAN apps (STARTTLS)
    volumes:
      - ./dms/mail-data:/var/mail
      - ./dms/mail-state:/var/mail-state
      - ./dms/mail-logs:/var/log/mail
      - ./dms/config:/tmp/docker-mailserver
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    stop_grace_period: 1m

  roundcube:
    image: roundcube/roundcubemail:1.6.9-apache
    container_name: roundcube
    depends_on:
      - mailserver
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: "ssl://mailserver"
      ROUNDCUBEMAIL_DEFAULT_PORT: "993"
      ROUNDCUBEMAIL_SMTP_SERVER: "tls://mailserver"
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      ROUNDCUBEMAIL_PRODUCT_NAME: "Johor Studio Mail"
      ROUNDCUBEMAIL_DB_TYPE: "sqlite"
    ports:
      - "8100:80"           # webmail -> Cloudflare tunnel (mail.johorstudio.com)
    volumes:
      - ./roundcube/config:/var/roundcube/config
      - ./roundcube/db:/var/roundcube/db
    restart: unless-stopped
